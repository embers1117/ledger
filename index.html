<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云同步记账本</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --muted:#8a94a6;
    --line:#e6eaf0; --expense:#ef4444; --income:#16a34a; --accent:#4f46e5;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; padding-bottom:48px;}
  .wrap{max-width:640px; margin:0 auto; padding:16px 14px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  h1{font-size:20px; margin:0;}
  .month-nav{display:flex; align-items:center; gap:10px;}
  .month-nav button{border:1px solid var(--line); background:var(--card); border-radius:10px; width:34px; height:34px; font-size:16px; cursor:pointer; color:var(--ink);}
  .month-label{font-weight:600; min-width:82px; text-align:center; font-size:15px;}
  .card{background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(16,24,40,.06);}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat{padding:12px; border-radius:12px; background:#fafbfc; border:1px solid var(--line);}
  .stat .k{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .stat .v{font-size:18px; font-weight:700; letter-spacing:-.3px;}
  .v.income{color:var(--income);} .v.expense{color:var(--expense);} .v.balance{color:var(--accent);}
  .budget-box{margin-top:12px;}
  .budget-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .budget-row label{font-size:13px; color:var(--muted); white-space:nowrap;}
  .budget-row input{flex:1; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px;}
  .bar{height:8px; background:#eef1f5; border-radius:99px; overflow:hidden;}
  .bar>div{height:100%; background:linear-gradient(90deg,#4f46e5,#7c3aed); border-radius:99px; transition:width .3s;}
  .bar.over>div{background:linear-gradient(90deg,#f97316,#ef4444);}
  .hint{font-size:12px; color:var(--muted); margin-top:6px;}
  .form-row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .seg{display:flex; background:#f1f3f7; border-radius:12px; padding:3px; flex:1;}
  .seg button{flex:1; border:none; background:transparent; padding:8px; border-radius:9px; cursor:pointer; font-size:14px; color:var(--muted);}
  .seg button.on{background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .seg button.on.exp{color:var(--expense);} .seg button.on.inc{color:var(--income);}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{flex:1 1 100%;}
  .field.half{flex:1 1 45%;}
  .field label{font-size:12px; color:var(--muted);}
  .field input,.field select{border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; background:#fff;}
  .field input:focus,.field select:focus{outline:2px solid #c7d2fe; border-color:var(--accent);}
  .btn-primary{width:100%; border:none; border-radius:12px; padding:13px; font-size:16px; font-weight:600; color:#fff; background:linear-gradient(90deg,#4f46e5,#7c3aed); cursor:pointer; margin-top:4px;}
  .btn-primary:active{opacity:.9;}
  .sec-title{font-size:14px; font-weight:700; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center;}
  .sec-title .sub{font-weight:400; color:var(--muted); font-size:12px;}
  .donut-wrap{display:flex; align-items:center; gap:16px;}
  .donut{width:110px; height:110px; border-radius:50%; flex:none; position:relative; background:#eef1f5;}
  .donut::after{content:""; position:absolute; inset:22px; background:#fff; border-radius:50%;}
  .donut .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2; font-size:11px; color:var(--muted);}
  .donut .center b{font-size:16px; color:var(--ink);}
  .legend{flex:1; min-width:0;}
  .leg-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0;}
  .dot{width:10px; height:10px; border-radius:3px; flex:none;}
  .leg-item .name{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .leg-item .amt{font-weight:600;}
  .leg-item .pct{color:var(--muted); width:46px; text-align:right; font-size:12px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:10px 0;}
  .record{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
  .record:last-child{border-bottom:none;}
  .r-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;}
  .r-icon.exp{background:#fee2e2; color:#dc2626;} .r-icon.inc{background:#dcfce7; color:#16a34a;}
  .r-main{flex:1; min-width:0;}
  .r-top{display:flex; align-items:center; gap:8px;}
  .r-cat{font-weight:600; font-size:14px;}
  .r-date{font-size:12px; color:var(--muted);}
  .r-note{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .r-amt{font-weight:700; font-size:15px;}
  .r-amt.exp{color:var(--expense);} .r-amt.inc{color:var(--income);}
  .del{border:none; background:transparent; color:#cbd2dc; font-size:18px; cursor:pointer; padding:4px 6px; border-radius:8px;}
  .del:hover{color:#ef4444; background:#fee2e2;}
  .tools{display:flex; gap:8px; flex-wrap:wrap;}
  .tools button,.tools label{flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px; font-size:13px; color:var(--muted); cursor:pointer; text-align:center; min-width:100px;}
  .status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#cbd2dc; margin-right:4px; vertical-align:middle;}
  .status-dot.ok{background:#16a34a;} .status-dot.bad{background:#ef4444;} .status-dot.busy{background:#f59e0b;}
  .code-box{background:#f1f3f7; border-radius:10px; padding:10px; font-family:monospace; font-size:12px; word-break:break-all; color:#4f46e5; margin-top:6px;}
  .footer{text-align:center; font-size:11px; color:#b6becb; margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💰 云同步记账本</h1>
    <div class="month-nav">
      <button id="prev">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="next">›</button>
    </div>
  </header>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k">本月收入</div><div class="v income" id="statIncome">¥0</div></div>
      <div class="stat"><div class="k">本月支出</div><div class="v expense" id="statExpense">¥0</div></div>
      <div class="stat"><div class="k">结余</div><div class="v balance" id="statBalance">¥0</div></div>
    </div>
    <div class="budget-box">
      <div class="budget-row">
        <label for="budget">本月预算</label>
        <input id="budget" type="number" min="0" step="50" placeholder="填一个数，比如 2000">
        <button style="border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;" id="budgetSave">保存</button>
      </div>
      <div class="bar" id="budgetBar"><div style="width:0%"></div></div>
      <div class="hint" id="budgetHint">设置预算后，这里会显示本月支出进度。</div>
    </div>
  </div>

  <div class="card">
    <div class="seg" id="typeSeg">
      <button class="on exp" data-t="expense">支出</button>
      <button class="inc" data-t="income">收入</button>
    </div>
    <div class="form-row" style="margin-top:12px;">
      <div class="field half"><label>分类</label><select id="category"></select></div>
      <div class="field half"><label>金额（元）</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
      <div class="field half"><label>日期</label><input id="date" type="date"></div>
      <div class="field half"><label>备注（可选）</label><input id="note" type="text" placeholder="如：食堂午饭"></div>
    </div>
    <button class="btn-primary" id="addBtn">记一笔</button>
  </div>

  <div class="card">
    <p class="sec-title">支出构成 <span class="sub" id="catMonth"></span></p>
    <div class="donut-wrap" id="donutWrap">
      <div class="donut" id="donut"><div class="center"><b id="donutTotal">¥0</b><span>本月支出</span></div></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="card">
    <p class="sec-title">明细 <span class="sub" id="recordCount"></span></p>
    <div id="records"></div>
  </div>

  <div class="card">
    <p class="sec-title">云同步 <span class="sub" id="syncStatus"><span class="status-dot"></span>未连接</span></p>
    <div class="field full"><label>GitHub 同步密钥（Token，形如 ghp_…）</label>
      <input id="token" type="password" placeholder="只保存在你自己的浏览器里，不会上传给别人"></div>
    <div class="field full" style="margin-top:10px;"><label>账本码（Gist ID）</label>
      <input id="gistId" placeholder="首次使用点下面「新建账本」会自动生成"></div>
    <div class="tools" style="margin-top:12px;">
      <button id="newBtn" style="color:#16a34a;">新建账本</button>
      <button id="bindBtn">绑定已有账本</button>
      <button id="syncNowBtn">立即同步</button>
      <button id="disconnectBtn" style="color:#ef4444;">断开</button>
    </div>
    <div class="hint" id="syncHint">首次使用：粘贴 Token → 点「新建账本」→ 把生成的账本码复制到手机端「绑定已有账本」即可两边同步。</div>
  </div>

  <div class="card">
    <p class="sec-title">数据备份</p>
    <div class="tools">
      <button id="exportBtn">导出备份</button>
      <label for="importFile">导入备份<input type="file" id="importFile" accept="application/json" hidden></label>
    </div>
  </div>

  <div class="footer">开启云同步后，数据存于你的 GitHub，手机电脑打开同一网址即自动同步。</div>
</div>

<script>
(function(){
  "use strict";
  var EXPENSE_CATS = ["餐饮","交通","学习","日用","服饰","娱乐","社交","通讯","医疗","其他"];
  var INCOME_CATS = ["生活费","奖学金","兼职","红包","其他"];
  var COLORS = ["#4f46e5","#0ea5e9","#10b981","#f59e0b","#ef4444","#ec4899","#8b5cf6","#14b8a6","#f97316","#64748b"];
  var KEY = "ledger_v2_data";
  var TOKEN_KEY = "ledger_v2_token";
  var GIST_KEY = "ledger_v2_gist";
  var OLD_KEY = "ledger_records_v1";
  var GIST_API = "https://api.github.com/gists";
  var FILE_NAME = "ledger.json";

  function pad(n){ return (n<10?"0":"")+n; }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function monthKey(date){ return date.slice(0,7); }
  function load(key, fallback){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
  function save(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  // 迁移旧版数据
  if(!localStorage.getItem(KEY)){
    var old = load(OLD_KEY, null);
    if(old && Array.isArray(old) && old.length){
      save(KEY, {records: old, deleted: []});
    }
  }

  var state = load(KEY, {records: [], deleted: []});
  var records = Array.isArray(state.records) ? state.records : [];
  var deleted = Array.isArray(state.deleted) ? state.deleted : [];
  var budgets = load("ledger_budgets_v1", {});
  var token = localStorage.getItem(TOKEN_KEY) || "";
  var gistId = localStorage.getItem(GIST_KEY) || "";
  var currentMonth = monthKey(todayStr());
  var type = "expense";
  var syncing = false;

  var $ = function(id){ return document.getElementById(id); };
  var monthLabel=$("monthLabel"), statIncome=$("statIncome"), statExpense=$("statExpense"),
      statBalance=$("statBalance"), budget=$("budget"), budgetBar=$("budgetBar"),
      budgetHint=$("budgetHint"), category=$("category"), amount=$("amount"),
      dateInput=$("date"), note=$("note"), addBtn=$("addBtn"),
      donut=$("donut"), donutTotal=$("donutTotal"), legend=$("legend"),
      recordsEl=$("records"), recordCount=$("recordCount"), catMonth=$("catMonth"),
      tokenInput=$("token"), gistInput=$("gistId"), syncStatus=$("syncStatus"),
      syncHint=$("syncHint");

  tokenInput.value = token;
  gistInput.value = gistId;
  dateInput.value = todayStr();

  function setStatus(cls, text){
    syncStatus.innerHTML = '<span class="status-dot '+cls+'"></span>'+text;
  }
  function refreshStatus(){
    if(!token || !gistId){ setStatus("", "未连接"); return; }
    setStatus("ok", "已连接");
  }

  function persist(){ save(KEY, {records: records, deleted: deleted}); }

  function refreshCategories(){
    var cats = type==="expense" ? EXPENSE_CATS : INCOME_CATS;
    category.innerHTML = "";
    cats.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=c; category.appendChild(o); });
  }
  function setType(t){
    type=t;
    document.querySelectorAll("#typeSeg button").forEach(function(b){
      var on=b.getAttribute("data-t")===t;
      b.classList.toggle("on",on);
      b.classList.toggle("exp",t==="expense");
      b.classList.toggle("inc",t==="income");
    });
    refreshCategories();
  }
  document.querySelectorAll("#typeSeg button").forEach(function(b){
    b.addEventListener("click", function(){ setType(b.getAttribute("data-t")); });
  });

  function monthRecords(m){ return records.filter(function(r){ return monthKey(r.date)===m; }); }
  function sumBy(list,t){ return list.filter(function(r){ return r.type===t; }).reduce(function(s,r){ return s+(Number(r.amount)||0); },0); }

  function render(){
    monthLabel.textContent = currentMonth.replace("-","年")+"月";
    var list = monthRecords(currentMonth);
    var inc = sumBy(list,"income"), exp = sumBy(list,"expense"), bal = inc-exp;
    statIncome.textContent = "¥"+inc.toFixed(2);
    statExpense.textContent = "¥"+exp.toFixed(2);
    statBalance.textContent = (bal>=0?"¥":"-¥")+Math.abs(bal).toFixed(2);

    var bud = budgets[currentMonth]||0;
    budget.value = bud||"";
    var pct = bud>0 ? Math.min(100, Math.round(exp/bud*100)) : 0;
    budgetBar.querySelector("div").style.width = pct+"%";
    budgetBar.classList.toggle("over", bud>0 && exp>bud);
    budgetHint.textContent = bud>0 ? (exp>bud ? "已超支 ¥"+(exp-bud).toFixed(2)+"，下月注意控制哦" : "已用 ¥"+exp.toFixed(2)+" / ¥"+bud.toFixed(2)+"，剩余 ¥"+(bud-exp).toFixed(2)) : "设置预算后，这里会显示本月支出进度。";

    renderDonut(list);
    renderRecords(list);
    refreshStatus();
  }

  function renderDonut(list){
    catMonth.textContent = currentMonth;
    var byCat = {};
    list.filter(function(r){ return r.type==="expense"; }).forEach(function(r){ byCat[r.category]=(byCat[r.category]||0)+(Number(r.amount)||0); });
    var entries = Object.keys(byCat).map(function(k){ return {name:k, amt:byCat[k]}; }).sort(function(a,b){ return b.amt-a.amt; });
    var total = entries.reduce(function(s,e){ return s+e.amt; },0);
    donutTotal.textContent = "¥"+total.toFixed(0);
    if(total<=0){ donut.style.background="#eef1f5"; legend.innerHTML='<div class="empty">本月还没有支出记录</div>'; return; }
    var stops=[], acc=0;
    entries.forEach(function(e,i){
      var start=acc/total*100; acc+=e.amt; var end=acc/total*100;
      stops.push(COLORS[i%COLORS.length]+" "+start.toFixed(2)+"% "+end.toFixed(2)+"%");
    });
    donut.style.background = "conic-gradient("+stops.join(",")+")";
    legend.innerHTML="";
    entries.forEach(function(e,i){
      var div=document.createElement("div"); div.className="leg-item";
      div.innerHTML='<span class="dot" style="background:'+COLORS[i%COLORS.length]+'"></span><span class="name"></span><span class="amt">¥'+e.amt.toFixed(2)+'</span><span class="pct">'+(e.amt/total*100).toFixed(1)+'%</span>';
      div.querySelector(".name").textContent=e.name;
      legend.appendChild(div);
    });
  }

  function iconFor(r){
    var exp = r.type==="expense";
    var icon = exp ? "🍜" : "💵";
    if(r.category.indexOf("交通")>=0) icon="🚇";
    else if(r.category.indexOf("学习")>=0) icon="📚";
    else if(r.category.indexOf("日用")>=0) icon="🧴";
    else if(r.category.indexOf("服饰")>=0) icon="👕";
    else if(r.category.indexOf("娱乐")>=0) icon="🎮";
    else if(r.category.indexOf("社交")>=0) icon="🥂";
    else if(r.category.indexOf("通讯")>=0) icon="📱";
    else if(r.category.indexOf("医疗")>=0) icon="💊";
    else if(r.category.indexOf("生活费")>=0) icon="🏦";
    else if(r.category.indexOf("奖学金")>=0) icon="🎓";
    else if(r.category.indexOf("兼职")>=0) icon="💼";
    else if(r.category.indexOf("红包")>=0) icon="🧧";
    return icon;
  }

  function renderRecords(list){
    var sorted = list.slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return (a.createdAt||0)<(b.createdAt||0)?1:-1;
    });
    recordCount.textContent = "共 "+sorted.length+" 笔";
    recordsEl.innerHTML="";
    if(sorted.length===0){ recordsEl.innerHTML='<div class="empty">本月还没有记录，点上方「记一笔」开始吧</div>'; return; }
    sorted.forEach(function(r){
      var exp = r.type==="expense";
      var div=document.createElement("div"); div.className="record";
      div.innerHTML='<div class="r-icon '+(exp?"exp":"inc")+'">'+iconFor(r)+'</div>'+
        '<div class="r-main"><div class="r-top"><span class="r-cat"></span><span class="r-date"></span></div><div class="r-note"></div></div>'+
        '<div class="r-amt '+(exp?"exp":"inc")+'">'+(exp?"-":"+")+'¥'+Number(r.amount).toFixed(2)+'</div>'+
        '<button class="del" title="删除">×</button>';
      div.querySelector(".r-cat").textContent = r.category;
      div.querySelector(".r-date").textContent = r.date.slice(5).replace("-","/");
      div.querySelector(".r-note").textContent = r.note || "";
      div.querySelector(".del").addEventListener("click", function(){ removeRecord(r.id); });
      recordsEl.appendChild(div);
    });
  }

  function addRecord(){
    var amt = Number(amount.value);
    if(!amount.value || !(amt>0)){ alert("请填写大于 0 的金额"); amount.focus(); return; }
    if(!dateInput.value){ alert("请选择日期"); return; }
    records.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      type: type, category: category.value, amount: Math.round(amt*100)/100,
      date: dateInput.value, note: note.value.trim(), createdAt: Date.now() });
    persist(); amount.value=""; note.value=""; render(); pushSync();
  }
  function removeRecord(id){
    if(!confirm("确定删除这一笔吗？")) return;
    records = records.filter(function(r){ return r.id!==id; });
    if(deleted.indexOf(id)<0) deleted.push(id);
    persist(); render(); pushSync();
  }
  addBtn.addEventListener("click", addRecord);
  amount.addEventListener("keydown", function(e){ if(e.key==="Enter") addRecord(); });

  function saveBudget(){
    var v=Number(budget.value);
    if(budget.value==="" || isNaN(v) || v<0){ delete budgets[currentMonth]; } else { budgets[currentMonth]=Math.round(v*100)/100; }
    save("ledger_budgets_v1", budgets); render();
  }
  $("budgetSave").addEventListener("click", saveBudget);

  function shiftMonth(delta){
    var p=currentMonth.split("-"); var d=new Date(+p[0], +p[1]-1+delta, 1);
    currentMonth=d.getFullYear()+"-"+pad(d.getMonth()+1); render();
  }
  $("prev").addEventListener("click", function(){ shiftMonth(-1); });
  $("next").addEventListener("click", function(){ shiftMonth(1); });

  // ---------- 云同步 ----------
  function snapshot(){ return { records: records, deleted: deleted, updatedAt: Date.now() }; }
  function merge(localR, localD, remoteR, remoteD){
    var map={};
    localR.concat(remoteR||[]).forEach(function(r){ if(r && r.id) map[r.id]=r; });
    var del={};
    (localD||[]).concat(remoteD||[]).forEach(function(id){ del[id]=true; });
    var rs=Object.keys(map).filter(function(id){ return !del[id]; }).map(function(id){ return map[id]; });
    return { records: rs, deleted: Object.keys(del) };
  }

  function apiHeaders(){ return { "Accept":"application/vnd.github+json", "Authorization":"Bearer "+token, "X-GitHub-Api-Version":"2022-11-28" }; }

  function pushSync(){
    if(!token || !gistId){ return Promise.resolve(); }
    if(syncing) return Promise.resolve();
    syncing=true; setStatus("busy","同步中…");
    var body = JSON.stringify(snapshot());
    var files = {}; files[FILE_NAME] = { content: body };
    return fetch(GIST_API+"/"+gistId, { method:"PATCH", headers: Object.assign(apiHeaders(),{"Content-Type":"application/json"}), body: JSON.stringify({files: files}) })
      .then(function(res){
        if(!res.ok) throw new Error("HTTP "+res.status);
        setStatus("ok","已同步 "+new Date().toLocaleTimeString());
        syncHint.textContent="";
      })
      .catch(function(e){ setStatus("bad","同步失败"); syncHint.textContent="同步失败："+e.message+"（可点「立即同步」重试）"; })
      .then(function(){ syncing=false; });
  }

  function createGist(){
    token = tokenInput.value.trim();
    if(!token){ alert("请先粘贴 GitHub Token"); return; }
    localStorage.setItem(TOKEN_KEY, token);
    setStatus("busy","创建中…");
    var files={}; files[FILE_NAME]={content: JSON.stringify(snapshot())};
    return fetch(GIST_API, { method:"POST", headers: Object.assign(apiHeaders(),{"Content-Type":"application/json"}), body: JSON.stringify({ description:"云同步记账本", public:false, files:files }) })
      .then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); })
      .then(function(g){
        gistId = g.id;
        localStorage.setItem(GIST_KEY, gistId);
        gistInput.value = gistId;
        setStatus("ok","已连接");
        syncHint.innerHTML='新建成功！账本码：<div class="code-box">'+gistId+'</div>请在手机端填同一个 Token + 此账本码，点「绑定已有账本」。';
      })
      .catch(function(e){ setStatus("bad","创建失败"); syncHint.textContent="创建失败："+e.message+"（请检查 Token 是否正确）"; });
  }

  function bindGist(){
    token = tokenInput.value.trim();
    var gid = gistInput.value.trim();
    if(!token){ alert("请先粘贴 GitHub Token"); return; }
    if(!gid){ alert("请粘贴账本码（Gist ID）"); return; }
    localStorage.setItem(TOKEN_KEY, token);
    setStatus("busy","绑定中…");
    return fetch(GIST_API+"/"+gid, { method:"GET", headers: apiHeaders() })
      .then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); })
      .then(function(g){
        gistId = gid;
        localStorage.setItem(GIST_KEY, gistId);
        gistInput.value = gistId;
        setStatus("ok","已连接");
        return pullFromGist(true);
      })
      .catch(function(e){ setStatus("bad","绑定失败"); syncHint.textContent="绑定失败："+e.message+"（请检查 Token 和账本码）"; });
  }

  function pullFromGist(showMsg){
    return fetch(GIST_API+"/"+gistId, { method:"GET", headers: apiHeaders() })
      .then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); })
      .then(function(g){
        var f = g.files && g.files[FILE_NAME];
        if(!f || !f.content){ return; }
        var remote = JSON.parse(f.content);
        var m = merge(records, deleted, remote.records||[], remote.deleted||[]);
        records = m.records; deleted = m.deleted; persist(); render();
        if(showMsg) syncHint.textContent="已从云端拉取并合并数据。";
      })
      .catch(function(e){ setStatus("bad","拉取失败"); syncHint.textContent="拉取失败："+e.message; });
  }

  $("newBtn").addEventListener("click", function(){ createGist(); });
  $("bindBtn").addEventListener("click", function(){ bindGist(); });
  $("syncNowBtn").addEventListener("click", function(){
    if(!token || !gistId){ alert("请先连接：粘贴 Token 后点「新建账本」或「绑定已有账本」"); return; }
    pullFromGist().then(pushSync);
  });
  $("disconnectBtn").addEventListener("click", function(){
    if(!confirm("断开仅清除本机的 Token 和账本码，云端数据不受影响。确定断开吗？")) return;
    token=""; gistId="";
    localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(GIST_KEY);
    tokenInput.value=""; gistInput.value="";
    syncHint.textContent="已断开。数据仍保留在本机，也可重新连接。";
    render();
  });

  // ---------- 备份 ----------
  $("exportBtn").addEventListener("click", function(){
    var data = JSON.stringify({records:records, deleted:deleted, budgets:budgets}, null, 2);
    var blob = new Blob([data], {type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="记账本备份-"+todayStr()+".json"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("importFile").addEventListener("change", function(e){
    var f=e.target.files[0]; if(!f) return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var d=JSON.parse(reader.result);
        var recs = d.records || (Array.isArray(d)?d:null);
        if(recs){
          if(!confirm("导入会合并到现有数据，继续吗？")) return;
          var m = merge(records, deleted, recs, d.deleted||[]);
          records=m.records; deleted=m.deleted;
          if(d.budgets) Object.assign(budgets, d.budgets);
          persist(); save("ledger_budgets_v1", budgets); render(); pushSync();
          alert("导入成功");
        } else { alert("文件格式不正确"); }
      }catch(err){ alert("导入失败，文件无法解析"); }
    };
    reader.readAsText(f); e.target.value="";
  });

  setType("expense");
  render();
  // 已连接时自动拉取云端
  if(token && gistId){ pullFromGist(false); }
})();
</script>
</body>
</html>
